# =============================================================================
# Qwen3-Coder-Next Full Stack
# =============================================================================
# This docker-compose runs the complete coding agent stack:
#   - Code LLM (Qwen3-Coder-Next via llama-server)
#   - Browser automation (noVNC, Playwright, video recording)
#   - VLM for image analysis (optional, use --profile vlm)
#   - ML services for UI automation (optional, use --profile ml)
#
# Usage:
#   docker compose up -d                    # Core services (Code LLM + browser)
#   docker compose --profile vlm up -d      # Include VLM
#   docker compose --profile ml up -d       # Include OmniParser + GUI-Actor
#   docker compose --profile all up -d      # Everything
#
# For the MCP server alone (without Code LLM), use:
#   cd mcp-browser-co-gnome && docker compose up -d
# =============================================================================

services:
  # ===========================================================================
  # Code LLM - Qwen3-Coder-Next running on llama.cpp with CUDA
  # ===========================================================================
  code-llm:
    build:
      context: .
      dockerfile: Dockerfile.llama-server
    image: llama-server-cuda:latest
    container_name: qwen3-server
    ports:
      - "${CODE_LLM_PORT:-8003}:8080"
    volumes:
      - ./models:/models:ro
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
    command:
      - --model
      - /models/Qwen3-Coder-Next-GGUF/${CODE_MODEL_FILE:-Qwen3-Coder-Next-Q3_K_S.gguf}
      - --alias
      - unsloth/Qwen3-Coder-Next
      - --n-gpu-layers
      - "999"
      - --ctx-size
      - "${CTX_SIZE:-120000}"
      - --context-shift
      - --port
      - "8080"
      - --jinja
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --flash-attn
      - "on"
      - --temp
      - "1.0"
      - --top-p
      - "0.95"
      - --min-p
      - "0.01"
      - --top-k
      - "40"
      - --repeat-penalty
      - "1.1"
      - --repeat-last-n
      - "256"
      - --batch-size
      - "4096"
      - --ubatch-size
      - "1024"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - qwen-net
    restart: unless-stopped

  # ===========================================================================
  # Browser Automation - Playwright + Xvfb + noVNC
  # ===========================================================================
  browser:
    build:
      context: ./mcp-browser-co-gnome/docker/browser
      dockerfile: Dockerfile
    container_name: automation-browser
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-secret}
      - RESOLUTION=${RESOLUTION:-1280x720x24}
      - DISPLAY=:99
      - INSTALL_UBLOCK=${INSTALL_UBLOCK:-true}
    ports:
      - "${NOVNC_PORT:-6080}:6080"   # noVNC web interface
      - "${VNC_PORT:-5900}:5900"     # VNC
      - "${CDP_PORT:-9222}:9222"     # Chrome DevTools Protocol
    volumes:
      - ./mcp-browser-co-gnome/tmp:/app/tmp
      - ./mcp-browser-co-gnome/tmp/sessions:/app/sessions
      - /dev/shm:/dev/shm
    networks:
      - qwen-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ===========================================================================
  # Video Recording - FFmpeg screen capture
  # ===========================================================================
  video:
    image: selenium/video:ffmpeg-7.1-20250515
    container_name: automation-video
    environment:
      - DISPLAY_CONTAINER_NAME=automation-browser
      - FILE_NAME=recording.mp4
      - VIDEO_SIZE=${VIDEO_SIZE:-1280x720}
      - FRAME_RATE=${FRAME_RATE:-15}
    volumes:
      - ./mcp-browser-co-gnome/tmp/videos:/videos
    depends_on:
      browser:
        condition: service_healthy
    networks:
      - qwen-net
    restart: unless-stopped

  # ===========================================================================
  # Cloudflare Tunnel (optional, use --profile tunnel)
  # ===========================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: automation-tunnel
    command: tunnel --no-autoupdate --url http://browser:6080
    depends_on:
      browser:
        condition: service_healthy
    networks:
      - qwen-net
    profiles:
      - tunnel

  # ===========================================================================
  # VLM - Vision Language Model (optional, use --profile vlm)
  # ===========================================================================
  vlm:
    build:
      context: ./mcp-browser-co-gnome/docker/vlm
      dockerfile: Dockerfile
    container_name: automation-vlm
    ports:
      - "${VLM_PORT:-8004}:8080"
    volumes:
      - ./mcp-browser-co-gnome/tmp/vlm-models:/app/models
    networks:
      - qwen-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    profiles:
      - vlm
      - all
    restart: unless-stopped

  # ===========================================================================
  # OmniParser - UI Element Detection (optional, use --profile ml)
  # ===========================================================================
  omniparser:
    build:
      context: ./mcp-browser-co-gnome/docker/omniparser
      dockerfile: Dockerfile
    container_name: automation-omniparser
    ports:
      - "${OMNIPARSER_PORT:-8010}:8000"
    volumes:
      - ./mcp-browser-co-gnome/tmp/omniparser:/app/output
      - omniparser-weights:/app/weights
    networks:
      - qwen-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    profiles:
      - ml
      - all
    restart: unless-stopped

  # ===========================================================================
  # GUI-Actor - Natural Language Click Model (optional, use --profile ml)
  # ===========================================================================
  gui-actor:
    build:
      context: ./mcp-browser-co-gnome/docker/gui-actor
      dockerfile: Dockerfile
    container_name: automation-gui-actor
    ports:
      - "${GUI_ACTOR_PORT:-8001}:8001"
    volumes:
      - gui-actor-models:/app/models
    networks:
      - qwen-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    profiles:
      - ml
      - all
    restart: unless-stopped

networks:
  qwen-net:
    driver: bridge

volumes:
  omniparser-weights:
  gui-actor-models:
